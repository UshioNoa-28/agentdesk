[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anna-agent"
version = "0.1.0"
description = "AgentDesk, a multi-agent collaboration platform built on FastAPI and LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "dishka>=1.5,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "langchain-core>=0.3,<2.0",
    "langchain-openai>=0.3,<2.0",
    "langgraph>=0.3,<2.0",
    "mcp>=1.29,<1.30",
    "python-dotenv>=1.0,<2.0",
    "mem0ai>=2.0,<3.0",
    "ollama>=0.4,<1.0",
    "qdrant-client>=1.13,<2.0",
    "prompt-toolkit>=3.0,<4.0",
    "rich>=13.0,<14.0",
    "autogen-core>=0.7.5",
    "rank-bm25>=0.2.2,<0.3",
]

[tool.setuptools.packages.find]
include = ["agent*", "health_monitor*", "cli*"]

[tool.setuptools.package-data]
agent = ["mcp.yaml", "skills.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# cli/ 由前端团队维护，暂不参与本仓库 lint（E501/F401/F541/F811/I001）。
"cli/**" = ["E501", "F401", "F541", "F811", "I001"]
